name: Reusable - Python CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: Path to the Python service to build (relative to repo root).
        required: true
        type: string
      python-version:
        description: Python version to run against.
        required: false
        type: string
        default: '3.14'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.working-directory }}/pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: |
          pip install pytest
          set +e
          pytest
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 5 ]; then
            echo "No tests collected yet — treating as success."
            exit 0
          fi
          exit "$exit_code"
