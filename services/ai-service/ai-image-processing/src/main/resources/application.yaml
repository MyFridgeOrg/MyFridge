spring:
  application:
    name: ai-image-processing
    test-image: 'images/test-image.png'
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
  ai:
    model:
      chat: bedrock-converse
    bedrock:
      aws:
        region: eu-central-1
      converse:
        chat:
          model: eu.mistral.pixtral-large-2502-v1:0
  cloud:
    function:
      definition: handleImageCaptured
    stream:
      bindings:
        handleImageCaptured-in-0:
          destination: myfridge.events
          group: ${spring.application.name}
          content-type: application/json
  rabbitmq:
    host: localhost
    port: 5672
    username: user
    password: password
    connection-timeout: 5s

  arconia:
    dev:
      services:
        postgresql:
          enabled: true
          image: postgres:latest
        rabbitmq:
          enabled: true
          image: rabbitmq:4-management

