[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-suggestion-py"
version = "0.1.0"
description = "Python FastAPI RAG-based recipe suggestion service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "pgvector",
    "litellm",
    "boto3",

]

[tool.setuptools.packages.find]
where = ["src"]
